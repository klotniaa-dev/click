[project]
name = "click-example-multicommand"
version = "1.0.0"
description = "Click multi-command example"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
]

[project.scripts]
multicommand = "multicommand:cli"

[build-system]
requires = ["flit_core<4"]
build-backend = "flit_core.buildapi"

[tool.flit.module]
name = "multicommand"
